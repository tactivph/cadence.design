name: Publish @tactivstudios/cadence-ui

# Publishes the library to GitHub Packages when you push a version tag (e.g. v0.1.0).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@tactivstudios'
      - run: npm ci --legacy-peer-deps
      - run: npm run build:lib
      - name: Publish
        run: npm publish ./dist/cadence-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
